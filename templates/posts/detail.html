  <article class="diary-detail">

    <span class="mood-tag mood-tag--joy">기쁨</span>

    <p class="diary-detail__content" style="margin-top:16px;">
      아침 일찍 가서 창가 자리 잡았다. 날씨도 좋고 공부도 잘 됐다.
      이런 날은 하루가 길게 느껴져서 좋다. 저녁엔 스터디 팀원들이랑
      저녁도 같이 먹었는데, 다들 요즘 프로젝트 얘기로 신나 보였다.
    </p>

    <div class="diary-detail__actions">
      <a href="#" class="btn btn--muted">목록으로</a>
      <a href="#" class="btn btn--primary">수정</a>
