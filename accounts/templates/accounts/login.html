{% extends 'base.html' %}
{% block title %}로그인 · 오늘의 다이어리{% endblock %}

{% block content %}
<h1 class="page-title">다시 만나서 반가워요 🖇️</h1>
<p class="page-subtitle">로그인하고 오늘의 기록을 이어가 볼까요?</p>

<div class="diary-form">
  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label class="form-label" for="{{ form.username.id_for_label }}">아이디</label>
      {{ form.username }}
    </div>

    <div class="form-group">
      <label class="form-label" for="{{ form.password.id_for_label }}">비밀번호</label>
      {{ form.password }}
    </div>

    {% if form.errors %}
      <p class="page-subtitle" style="color: var(--accent-excited); margin: -8px 0 20px;">
        아이디 또는 비밀번호가 올바르지 않아요.
      </p>
    {% endif %}

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn--primary">로그인</button>
  </form>
</div>
{% endblock %}
